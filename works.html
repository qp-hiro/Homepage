    <!-- Card data is generated from the Drive folder by tools/build_works.py -->
    <script src="works/works-data.js"></script>
    <script>
        const container = document.getElementById('works-container');

        WORKS_DATA
            .slice()
            .sort((a, b) => Number(b.year) - Number(a.year) || b.num - a.num)
            .forEach((work, cardIdx) => {
                const a = document.createElement('a');
                a.href = work.detailsPath;
                a.className = 'work-card';
                a.setAttribute('data-reveal', '');

                const paths = work.imagePaths || (work.imagePath ? [work.imagePath] : []);
                const imgs = paths.map((src, i) =>
                    `<img class="work-card__img${i === 0 ? ' is-active' : ''}" src="${src}" alt="${work.title}" loading="lazy">`
                ).join('');

                a.innerHTML = `
                    <div class="work-card__slides" data-slides>
                        ${imgs}
                    </div>
                    <div class="work-card__veil"></div>
                    <span class="work-card__num">№ ${String(work.num).padStart(2, '0')}</span>
                    <span class="work-card__year">${work.year}</span>
                    <div class="work-card__caption">
                        <h2 class="work-card__title">${work.title}</h2>
                        <p class="work-card__subtitle">— ${work.subtitle}</p>
                    </div>
                    <span class="work-card__arrow" aria-hidden="true">↗</span>
                `;
                container.appendChild(a);

                if (paths.length > 1) {
                    const slides = a.querySelectorAll('.work-card__img');
                    let i = 0;
                    // stagger start per card so the whole grid doesn't fade in unison
                    setTimeout(() => {
                        setInterval(() => {
                            slides[i].classList.remove('is-active');
                            i = (i + 1) % slides.length;
                            slides[i].classList.add('is-active');
                        }, 4000);
                    }, cardIdx * 900);
                }
            });
    </script>
