name: Hero sync

# Sync hero background images from the Drive Background folder into Hero/,
# then regenerate the <!-- HERO:AUTO --> block in index.html.
on:
  push:
    paths:
      - "Hero/**"
      - "tools/build_hero.py"
      - "tools/drive_sync_background.py"
      - ".github/workflows/hero-sync.yml"
  schedule:
    - cron: "20 * * * *"
  workflow_dispatch:

concurrency:
  group: hero-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install --quiet google-api-python-client google-auth google-auth-oauthlib

      - name: Write service account key
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
        run: |
          printf '%s' "$DRIVE_SA_KEY" > /tmp/sa.json
          chmod 600 /tmp/sa.json

      - name: Download Background images from Drive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          BACKGROUND_FOLDER_ID: ${{ secrets.BACKGROUND_FOLDER_ID }}
        run: python tools/drive_sync_background.py

      - name: Rebuild hero block
        run: python tools/build_hero.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Hero/ index.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "hero: auto-sync from Drive Background folder"
          git pull --rebase --autostash origin main
          git push origin main
