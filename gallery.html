    <script>
    /* ═══════════════════════════════════════════════════════════════
       GALLERY — sidebar-driven. Click a category on the left,
       its photos replace the content on the right.
       Data: window.GALLERY_DATA (inlined by tools/build_gallery.py)
       Images: Gallery/<slug>/<filename>
       ═══════════════════════════════════════════════════════════════ */
    (() => {
        'use strict';

        const sideEl    = document.getElementById('gallery-side');
        const activeEl  = document.getElementById('gallery-active');
        const countEl   = document.getElementById('gallery-count');
        const emptyEl   = document.getElementById('gallery-empty');

        const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

        /* Fisher–Yates shuffle (returns a new array; original untouched). */
        function shuffle(arr) {
            const a = arr.slice();
            for (let i = a.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [a[i], a[j]] = [a[j], a[i]];
            }
            return a;
        }

        /* Cluster photos by "same session".
           Preferred signal: an explicit `cluster` field on the photo
           (set by build_gallery.py from Drive subfolder names, e.g. the
           country under People/<Country>/*.jpg).
           Fallback: filename numeric prefix — most cameras number
           consecutive shots so nearby numbers = same session. */
        function clusterPhotos(photos) {
            const hasExplicit = photos.some(p => typeof p === 'object' && p.cluster);
            if (hasExplicit) {
                const groups = new Map();
                for (const p of photos) {
                    const key = (p && p.cluster) || '';
                    if (!groups.has(key)) groups.set(key, []);
                    groups.get(key).push(p);
                }
                return Array.from(groups.values());
            }
            const GAP = 1000;
            const items = photos.map((p, idx) => {
                const file = (typeof p === 'string') ? p : p.file;
                const m = file.match(/([^0-9]*)(\d+)/);
                return {
                    photo: p,
                    prefix: m ? m[1].toLowerCase() : '',
                    num: m ? parseInt(m[2], 10) : idx,
                };
            });
            items.sort((a, b) =>
                a.prefix === b.prefix ? a.num - b.num : a.prefix.localeCompare(b.prefix)
            );
            const clusters = [];
            let current = [];
            for (const it of items) {
                if (!current.length) { current.push(it); continue; }
                const prev = current[current.length - 1];
                if (it.prefix === prev.prefix && (it.num - prev.num) < GAP) {
                    current.push(it);
                } else {
                    clusters.push(current);
                    current = [it];
                }
            }
            if (current.length) clusters.push(current);
            return clusters.map(c => c.map(it => it.photo));
        }

        /* Row counts per cluster so each cluster occupies contiguous rows
           without an orphan. Patterns per size: 1→[1] 2→[2] 3→[3] 4→[2,2]
           5→[3,2] 6→[3,3] 7+→alternate 3,2 then settle leftover. */
        function planRowsForClusters(clusters) {
            const rows = [];
            for (const cluster of clusters) {
                let remaining = cluster.length;
                let turn = 0;
                while (remaining > 0) {
                    let size;
                    if (remaining <= 3)       size = remaining;
                    else if (remaining === 4) size = 2;
                    else if (remaining === 5) size = 3;
                    else                      size = (turn % 2 === 0) ? 3 : 2;
                    rows.push(size);
                    remaining -= size;
                    turn++;
                }
            }
            return rows;
        }

        /* Lightbox */
        const lb = document.querySelector('.lightbox');
        const lbImg = lb.querySelector('img');
        const openLightbox = (src, alt) => { lbImg.src = src; lbImg.alt = alt || ''; lb.classList.add('is-open'); };
        lb.addEventListener('click', () => lb.classList.remove('is-open'));
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') lb.classList.remove('is-open'); });

        let cats = [];
        let activeIdx = 0;

        function renderSidebar() {
            sideEl.innerHTML = cats.map((c, i) => `
                <button type="button" class="gallery-side__item${i === activeIdx ? ' is-active' : ''}" data-cat-idx="${i}">
                    <span class="gallery-side__name">${esc(c.name)}</span>
                    ${c.name_jp ? `<span class="gallery-side__jp">${esc(c.name_jp)}</span>` : ''}
                    <span class="gallery-side__count">${String(c.photos.length).padStart(2, '0')}</span>
                </button>
            `).join('');
            sideEl.querySelectorAll('.gallery-side__item').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.catIdx, 10);
                    if (idx === activeIdx) return;
                    activeIdx = idx;
                    sideEl.querySelectorAll('.gallery-side__item').forEach(b => b.classList.toggle('is-active', parseInt(b.dataset.catIdx, 10) === activeIdx));
                    renderActive(/*animate*/ true);
                });
            });
        }

        /* ─── Justified rows layout (desktop only). ────────────────────
           Adaptive row sizing: we PRE-PLAN how many tiles each row should
           contain so that row heights vary deliberately (not just by
           aspect mix). Pattern alternates [3, 2, 3, 2, …] and leftovers
           fall out as single-tile "feature" rows. Each row is then scaled
           to the container width while preserving every tile's natural
           aspect — so all gaps (both between tiles and between rows)
           remain exactly `--gallery-gap`, and row heights differ because
           the number of tiles per row differs. */
        function planRowCounts(N) {
            if (N <= 0) return [];
            if (N <= 3) return [N];
            const rows = [];
            let remaining = N;
            let i = 0;
            while (remaining >= 2) {
                const size = (i % 2 === 0) ? 3 : 2;
                if (size > remaining) { rows.push(remaining); remaining = 0; break; }
                rows.push(size);
                remaining -= size;
                i++;
            }
            if (remaining === 1) rows.push(1);
            return rows;
        }

        function layoutJustified(grid) {
            if (!grid) return;
            const isMobile = window.matchMedia('(max-width: 720px)').matches;
            const tiles = Array.from(grid.querySelectorAll('.gallery-tile'));
            if (isMobile) {
                // Let CSS multi-column handle it; strip inline styles
                grid.style.height = '';
                tiles.forEach(t => {
                    t.style.left = ''; t.style.top = '';
                    t.style.width = ''; t.style.height = '';
                });
                return;
            }
            if (!tiles.length) { grid.style.height = ''; return; }

            const gap = parseFloat(getComputedStyle(grid).getPropertyValue('--gallery-gap').trim()) || 16;
            const gridW = grid.getBoundingClientRect().width;
            if (gridW <= 0) return;

            // Cap how dramatic a single-tile "feature" row can be — otherwise a
            // lone landscape ends up gridW tall which overwhelms the layout.
            const maxRowH = Math.max(380, gridW / 1.8);

            // Gather aspect ratios (prefer the manifest's width/height, fall
            // back to the decoded image size)
            const items = tiles.map(tile => {
                const img = tile.querySelector('img');
                const w = parseFloat(img && img.getAttribute('width'))  || (img && img.naturalWidth)  || 1;
                const h = parseFloat(img && img.getAttribute('height')) || (img && img.naturalHeight) || 1;
                return { el: tile, aspect: w / h };
            });

            // renderActive stashes the cluster-derived row plan on the grid
            // (as data-row-counts); layoutJustified prefers it and falls back
            // to the old 3,2,… alternation only when the attribute is missing.
            let rowCounts;
            if (grid.dataset.rowCounts) {
                rowCounts = grid.dataset.rowCounts.split(',').map(Number);
            } else {
                rowCounts = planRowCounts(items.length);
            }
            let y = 0;
            let cursor = 0;

            rowCounts.forEach((count) => {
                const row = items.slice(cursor, cursor + count);
                cursor += count;
                if (!row.length) return;

                // Target row width = gridW − inter-tile gaps. Row height is set so
                // the sum of (height × aspect) across tiles exactly fills that.
                const gaps = gap * (row.length - 1);
                const availW = gridW - gaps;
                const sumAspect = row.reduce((a, it) => a + it.aspect, 0);
                let rowH = availW / sumAspect;

                // Cap for 1-tile feature rows so they don't dominate the page
                if (rowH > maxRowH) rowH = maxRowH;

                let x = 0;
                row.forEach((it) => {
                    const w = rowH * it.aspect;
                    it.el.style.left   = x + 'px';
                    it.el.style.top    = y + 'px';
                    it.el.style.width  = w + 'px';
                    it.el.style.height = rowH + 'px';
                    x += w + gap;
                });

                y += rowH + gap;
            });

            grid.style.height = Math.max(0, y - gap) + 'px';
        }

        let resizeRaf = 0;
        window.addEventListener('resize', () => {
            if (resizeRaf) cancelAnimationFrame(resizeRaf);
            resizeRaf = requestAnimationFrame(() => {
                const grid = activeEl.querySelector('.gallery-active__grid');
                layoutJustified(grid);
            });
        }, { passive: true });

        function renderActive(animate) {
            const c = cats[activeIdx];
            if (!c) { activeEl.innerHTML = ''; return; }

            activeEl.classList.remove('is-in');
            // force reflow so the next class flip restarts the transition
            void activeEl.offsetWidth;

            activeEl.innerHTML = `
                <header class="gallery-active__head">
                    <h2 class="gallery-active__title">
                        <span>${esc(c.name)}</span>
                        ${c.name_jp ? `<span class="jp">${esc(c.name_jp)}</span>` : ''}
                    </h2>
                    <span class="gallery-active__count">${String(c.photos.length).padStart(2, '0')} photos</span>
                </header>
                <div class="gallery-active__grid"></div>
            `;
            const grid = activeEl.querySelector('.gallery-active__grid');
            // Cluster photos by session (country folder, or filename proximity),
            // shuffle only the CLUSTER order so each visit varies but shots
            // from the same place stay in the same row.
            const clusters = shuffle(clusterPhotos(c.photos));
            grid.dataset.rowCounts = planRowsForClusters(clusters).join(',');
            const ordered = clusters.flat();
            ordered.forEach((p) => {
                const file = typeof p === 'string' ? p : p.file;
                const w = typeof p === 'object' ? p.w : 0;
                const h = typeof p === 'object' ? p.h : 0;
                // file may contain slashes (nested cluster subfolders) — encode each segment
                const src = `Gallery/${encodeURIComponent(c.slug)}/` + file.split('/').map(encodeURIComponent).join('/');
                const alt = `${c.name} — ${file}`;
                const tile = document.createElement('button');
                tile.type = 'button';
                tile.className = 'gallery-tile';
                tile.setAttribute('aria-label', `Open ${alt}`);
                const sizeAttrs = (w && h) ? ` width="${w}" height="${h}"` : '';
                tile.innerHTML = `<img src="${src}" alt="${esc(alt)}" loading="lazy"${sizeAttrs}>`;
                tile.addEventListener('click', () => openLightbox(src, alt));
                // once the real image decodes, re-layout (natural size is more accurate than manifest)
                tile.querySelector('img').addEventListener('load', () => layoutJustified(grid), { once: true });
                grid.appendChild(tile);
            });

            // first-pass layout uses the width/height attributes from the manifest
            requestAnimationFrame(() => {
                layoutJustified(grid);
                activeEl.classList.add('is-in');
            });
        }

        function render(data) {
            cats = Array.isArray(data?.categories) ? data.categories.filter(c => c?.photos?.length) : [];
            const totalPhotos = cats.reduce((n, c) => n + c.photos.length, 0);
            emptyEl.hidden = totalPhotos > 0;
            countEl.textContent = totalPhotos ? `${cats.length} categories · ${totalPhotos} photos` : '—';
            if (!cats.length) { sideEl.innerHTML = ''; activeEl.innerHTML = ''; return; }
            activeIdx = Math.min(activeIdx, cats.length - 1);
            renderSidebar();
            renderActive(false);
        }

        render(window.GALLERY_DATA || { categories: [] });
    })();
    </script>
