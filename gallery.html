    <script>
        /* ► EDIT: add photos here — one object per photo, newest first.
           src:      image URL. For Google Drive images use
                     'https://lh3.googleusercontent.com/d/FILE_ID' with the
                     file shared as "anyone with the link can view".
           title:    short English title (optional: '' to hide)
           jp:       Japanese caption (optional)
           year:     e.g. '2026'
           location: e.g. 'Tokyo' (optional)

           Example:
           {
               src: 'https://lh3.googleusercontent.com/d/XXXXXXXXXXXX',
               title: 'Morning Light',
               jp: '朝の光',
               year: '2026',
               location: 'Tokyo'
           },
        */
        const photos = [
        ];

        const container = document.getElementById('gallery-container');
        const emptyEl = document.getElementById('gallery-empty');

        if (!photos.length) {
            emptyEl.hidden = false;
        } else {
            photos.forEach((p) => {
                const fig = document.createElement('figure');
                fig.className = 'photo-card';
                fig.setAttribute('data-reveal', '');

                const img = document.createElement('img');
                img.src = p.src;
                img.alt = p.title || 'Photograph by Hirosuke Asahi';
                img.loading = 'lazy';
                img.setAttribute('data-lightbox', '');
                fig.appendChild(img);

                const metaBits = [p.year, p.location].filter(Boolean).join(' · ');
                if (p.title || p.jp || metaBits) {
                    const cap = document.createElement('figcaption');
                    cap.className = 'photo-card__caption';
                    cap.innerHTML =
                        (p.title ? `<span class="photo-card__title">${p.title}</span>` : '') +
                        (p.jp ? `<span class="photo-card__jp">${p.jp}</span>` : '') +
                        (metaBits ? `<span class="photo-card__meta">${metaBits}</span>` : '');
                    fig.appendChild(cap);
                }
                container.appendChild(fig);
            });
        }
    </script>
    <script src="main.js"></script>
    <script src="chatbot.js" defer></script>
