name: Works sync

# Runs hourly and whenever triggered manually. Pulls new paper PDFs /
# images from the Drive Files_for_works folder, rebuilds the Works page,
# and pushes if anything actually changed.
#
# Works updates less often than photos, so hourly polling is enough.
# For an immediate update: Actions tab → Works sync → Run workflow.
on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

concurrency:
  group: works-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --quiet \
            Pillow \
            PyMuPDF \
            google-api-python-client \
            google-auth \
            google-auth-oauthlib

      - name: Write service account key
        env:
          DRIVE_SA_KEY: ${{ secrets.DRIVE_SA_KEY }}
        run: |
          printf '%s' "$DRIVE_SA_KEY" > /tmp/sa.json
          chmod 600 /tmp/sa.json

      - name: Download Works source from Drive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/sa.json
          WORKS_FOLDER_ID: ${{ secrets.WORKS_FOLDER_ID }}
          WORKS_DRIVE_DIR: /tmp/works-src
        run: python tools/drive_sync_works.py

      - name: Build Works
        env:
          WORKS_DRIVE_DIR: /tmp/works-src
        run: python tools/build_works.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works/ index.html llms-full.txt chatbot.js tools/.works_cache.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "works: auto-sync from Drive"
          git pull --rebase --autostash origin main
          git push origin main
