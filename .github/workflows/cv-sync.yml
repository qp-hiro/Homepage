name: CV sync

# Regenerate cv.pdf / cv.html / cv.md whenever any source changes.
on:
  push:
    paths:
      - "profile.json"
      - "publications.json"
      - "tools/build_cv.py"
      - ".github/workflows/cv-sync.yml"
  schedule:
    - cron: "45 3 * * *"
  workflow_dispatch:

concurrency:
  group: cv-sync
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Noto CJK fonts (so Japanese text renders in the PDF)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-noto-cjk

      - name: Install WeasyPrint
        run: pip install --quiet weasyprint

      - name: Build CV
        run: python tools/build_cv.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv.md cv.html cv.pdf 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "cv: regenerate from profile.json + publications.json"
          git pull --rebase --autostash origin main
          git push origin main
